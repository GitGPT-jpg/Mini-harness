name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 全量冒烟 nightly（北京时间午夜）：PR 只跑 --core 快检，慢/重测试由这里兜底。
  schedule:
    - cron: "0 16 * * *"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci

      # 代码格式（prettier；失败先修格式：npm run format）
      - name: Check formatting
        run: npm run format:check

      # 静态检查（oxlint；失败先看报告：npm run lint）
      - name: Lint
        run: npm run lint

      # 协议双端手工同步校验（server/protocol.ts ↔ web/src/types.ts）
      - name: Check protocol sync
        run: node scripts/check-protocol-sync.mjs

      # 语言包 key 对照（locales/*.json 与 web/src/i18n.tsx 的 zh 源头；缺 key / 死 key 即红）
      - name: Check locale packs
        run: npm run i18n:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 纯函数单测（毫秒级、零 token）
      - name: Unit tests
        run: npx vitest run

      # 零 token 协议冒烟（每个测试自起隔离 server：独立端口 + 临时 data-dir）
      # 分层：PR 跑 --core 快检（~20 个，2~4 分钟），push main / nightly 跑全量（~70 个）。
      - name: Protocol smoke tests (core, PR fast gate)
        if: github.event_name == 'pull_request'
        # --no-build：上面的 Build 步骤已经构建过 dist/，跑器不必再构建一次
        # （用例内的构建也由跑器统一接管，见 tests/lib/ensure-build.mjs）。
        run: node tests/run-smoke.mjs --core --retry-once --jobs=4 --no-build

      - name: Protocol smoke tests (full)
        if: github.event_name != 'pull_request'
        run: node tests/run-smoke.mjs --retry-once --jobs=4 --no-build
